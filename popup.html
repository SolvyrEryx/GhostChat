<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

  body {
    width: 300px;
    height: 360px;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace;
    background: #0B0F14;
    color: #E5E7EB;
    position: relative;
    overflow: hidden;
  }

  /* ================= Boot Screen ================= */

  #bootScreen {
    position: absolute;
    inset: 0;
    background: #0B0F14;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #22FFAA;
    padding: 20px;
    text-align: left;
    z-index: 10;
  }

  .boot-text {
    white-space: pre-line;
    text-shadow: 0 0 6px rgba(34,255,170,0.5);
    line-height: 1.6;
  }

  .fade-out {
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  /* ================= Main UI ================= */

  .title {
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 2px;
    color: #22FFAA;
    text-shadow: 0 0 8px rgba(34,255,170,0.4);
    animation: glowPulse 3s infinite ease-in-out;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 6px rgba(34,255,170,0.3); }
    50% { text-shadow: 0 0 14px rgba(34,255,170,0.6); }
    100% { text-shadow: 0 0 6px rgba(34,255,170,0.3); }
  }

  .tagline {
    font-size: 11px;
    margin-top: 4px;
    color: #9CA3AF;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, #22FFAA, transparent);
    margin: 16px 0;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FF3B3B;
    box-shadow: 0 0 6px rgba(255,59,59,0.5);
    transition: all 0.3s ease;
  }

  .indicator.active {
    background: #22FFAA;
    box-shadow: 0 0 8px rgba(34,255,170,0.8);
  }

  .status-text {
    font-size: 11px;
    color: #9CA3AF;
  }

  input {
    width: 100%;
    padding: 10px;
    background: #121821;
    border: 1px solid #1F2937;
    border-radius: 6px;
    color: #22FFAA;
    outline: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  input:focus {
    border-color: #22FFAA;
    box-shadow: 0 0 10px rgba(34,255,170,0.35);
  }

  .buttons {
    display: flex;
    justify-content: space-between;
  }

  button {
    width: 48%;
    padding: 8px;
    margin-top: 12px;
    border-radius: 6px;
    border: none;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #save {
    background: #22FFAA;
    color: #0B0F14;
    font-weight: 600;
  }

  #clear {
    background: #1F2937;
    color: #E5E7EB;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 8px rgba(34,255,170,0.4);
  }

  #status {
    margin-top: 12px;
    font-size: 11px;
  }
  </style>
</head>

<body>

  <!-- Boot Screen -->
  <div id="bootScreen">
    <div class="boot-text" id="bootText"></div>
  </div>

  <!-- Main UI -->
  <div id="mainUI" style="display:none;">

    <div class="title">GHOSTCHAT</div>
    <div class="tagline">Reclaim your privacy.</div>

    <div class="divider"></div>

    <div class="status-bar">
      <div class="indicator" id="indicator"></div>
      <div class="status-text" id="statusText">Encryption inactive</div>
    </div>

    <input type="password" id="passphrase" placeholder="Enter passphrase" />

    <div class="buttons">
      <button id="save">Save</button>
      <button id="clear">Clear</button>
    </div>

    <div id="status"></div>

  </div>

  <script src="popup.js"></script>

</body>
</html>
